bind 0.0.0.0
port 6379
protected-mode no
requirepass root@XH2001!

# RDB 持久化
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb

# AOF 持久化
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存
maxmemory 256mb
maxmemory-policy allkeys-lru

timeout 0
tcp-backlog 511
loglevel notice
logfile ""
databases 16
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 128
pidfile ""
daemonize no
supervised no
cluster-enabled no
