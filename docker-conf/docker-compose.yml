services:
  mysql:
    image: mysql:8.0.45
    container_name: va-mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: root@XH2001!
      MYSQL_DATABASE: db_voice_accounting
    volumes:
      - mysql_data:/var/lib/mysql
      - ${PWD}/mysql/my.cnf:/etc/my.cnf
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: va-redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
      - ${PWD}/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root@XH2001!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:25-jre
    container_name: va-backend
    expose:
      - "8080"
    environment:
      TZ: ${TZ}
    volumes:
      - ${PWD}/backend/backend-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ${PWD}/backend/application-prod.yml:/app/application-prod.yml
    working_dir: /app
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:./application-prod.yml"]
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    container_name: va-frontend
    expose:
      - "80"
    environment:
      TZ: ${TZ}
    volumes:
      - ${PWD}/frontend/dist:/usr/share/nginx/html
      - ${PWD}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  webnet:
    external: true
