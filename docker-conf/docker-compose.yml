services:
  mysql:
    image: mysql:8.0.45
    container_name: va-mysql
    restart: unless-stopped
    ports:
      - "${DB_PORT}:3306"
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: db_voice_accounting
    volumes:
      - mysql_data:/var/lib/mysql
      - ${PWD}/mysql/my.cnf:/etc/my.cnf
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: va-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
      - ${PWD}/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:25-jre
    container_name: va-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      TZ: ${TZ}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY}
      ALIYUN_NLS_APP_KEY: ${ALIYUN_NLS_APP_KEY}
      ALIYUN_NLS_ACCESS_KEY_ID: ${ALIYUN_NLS_ACCESS_KEY_ID}
      ALIYUN_NLS_ACCESS_KEY_SECRET: ${ALIYUN_NLS_ACCESS_KEY_SECRET}
    volumes:
      - ${PWD}/backend/backend-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ${PWD}/backend/application-prod.yml:/app/application-prod.yml
    working_dir: /app
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:./application-prod.yml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webnet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    container_name: va-frontend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: ${TZ}
    volumes:
      - ${PWD}/frontend/dist:/usr/share/nginx/html
      - ${PWD}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webnet
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  webnet:
    external: true
