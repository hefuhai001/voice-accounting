# 绑定监听地址，0.0.0.0 允许所有连接
bind 0.0.0.0

# 端口
port 6379

# 保护模式（生产环境建议开启，配合密码使用）
protected-mode no

# 密码认证
requirepass ${REDIS_PASSWORD}

# 数据持久化目录
# dir /data

# RDB 持久化配置
# 900 秒内至少有 1 个 key 变更则触发快照
save 900 1
# 300 秒内至少有 10 个 key 变更则触发快照
save 300 10
# 60 秒内至少有 10000 个 key 变更则触发快照
save 60 10000

# 禁用 RDB 持久化（如使用 AOF 可注释掉上面 save 配置）
# save ""

# RDB 文件名
dbfilename dump.rdb

# AOF 持久化配置
appendonly yes

# AOF 文件名
appendfilename "appendonly.aof"

# AOF 同步策略：每秒同步一次
appendfsync everysec

# 最大内存限制（根据实际服务器内存调整）
maxmemory 256mb

# 内存淘汰策略：最近最少使用
maxmemory-policy allkeys-lru

# 超时时间（毫秒），0 表示不超时
timeout 0

# TCP 连接队列长度
tcp-backlog 511

# 日志级别
loglevel notice

# 日志输出到标准输出（容器环境推荐）
logfile ""

# 数据库数量
databases 16

# 客户端最大连接数
maxclients 10000

# 开启慢查询日志，超过 10000 微秒（10ms）记录
slowlog-log-slower-than 10000

# 慢查询日志最大条数
slowlog-max-len 128

# 后台进程文件（容器环境不需要）
pidfile ""

# 后台运行（容器环境必须 no）
daemonize no

# 监督模式
supervised no

# 是否开启集群模式
cluster-enabled no
