services:
  mysql:
    image: mysql:8.0.45
    container_name: va-mysql
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: ${TZ}
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
      --skip-name-resolve
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: va-redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:25-jre
    container_name: va-backend
    expose:
      - "${SERVER_PORT}"
    environment:
      TZ: ${TZ}
      SERVER_PORT: 8080
      SPRING_APPLICATION_NAME: ${APP_NAME}
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: ${REDIS_DATABASE}
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY}
      ALIYUN_NLS_APP_KEY: ${ALIYUN_NLS_APP_KEY}
      ALIYUN_NLS_ACCESS_KEY_ID: ${ALIYUN_NLS_ACCESS_KEY_ID}
      ALIYUN_NLS_ACCESS_KEY_SECRET: ${ALIYUN_NLS_ACCESS_KEY_SECRET}
    volumes:
      - ${PWD}/backend/backend-0.0.1-SNAPSHOT.jar:/app/app.jar
      - ${PWD}/backend/application-prod.yml:/app/application-prod.yml
    working_dir: /app
    command: ["java", "-jar", "app.jar", "--spring.config.additional-location=file:./application-prod.yml"]
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    container_name: va-frontend
    expose:
      - "${NGINX_PORT}"
    environment:
      TZ: ${TZ}
      NGINX_PORT: ${NGINX_PORT}
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    volumes:
      - ${PWD}/frontend/dist:/usr/share/nginx/html
      - ${PWD}/frontend/nginx.conf:/etc/nginx/templates/default.conf.template
    restart: unless-stopped
    networks:
      - webnet
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:

networks:
  webnet:
    external: true
