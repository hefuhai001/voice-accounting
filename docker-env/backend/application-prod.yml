# 此文件仅包含不可通过环境变量覆盖的结构性配置
# 所有可变值（数据库、Redis、邮件、端口、超时等）均通过环境变量传入

spring:
  data:
    redis:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          starttls:
            enable: true
        debug: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hfh.api.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '管理端接口'
      paths-to-match: '/admin/**'
      packages-to-scan: com.hfh.api.admin.controller
    - group: '用户端接口'
      paths-to-match: '/api/**'
      packages-to-scan: com.hfh.api.user.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表

sa-token:
  token-name: Authorization
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
