spring:
  application:
    name: backend
  # 默认激活 local profile（读取根目录 application-local.yaml 中的真实密钥）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Spring AI - DeepSeek
  ai:
    openai:
      # 敏感值通过环境变量注入，本地开发由 application-local.yaml 覆盖
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.7
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_voice_accounting?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  mail:
    host: smtp.163.com
    port: 994
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          starttls:
            enable: true
        debug: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hfh.api.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 阿里云智能语音交互配置（敏感值通过环境变量注入，本地由 application-local.yaml 覆盖）
aliyun:
  nls:
    app-key: ${ALIYUN_NLS_APP_KEY}
    access-key-id: ${ALIYUN_NLS_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_NLS_ACCESS_KEY_SECRET}

server:
  port: 8080

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '管理端接口'
      paths-to-match: '/admin/**'
      packages-to-scan: com.hfh.api.admin.controller
    - group: '用户端接口'
      paths-to-match: '/api/**'
      packages-to-scan: com.hfh.api.user.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表

# Sa-Token 配置
sa-token:
  # token名称（同时也是Header名称）
  token-name: Authorization
  # Access Token有效期（单位：秒），2小时
  timeout: 7200
  # 是否允许同一账号多地同时登录（为true时允许，为false时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: false
  # token风格（uuid可读性更好）
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  # 关闭Cookie模式，使用Header传递Token
  is-read-cookie: false
  # 开启Header模式，前端通过Authorization头传递Token
  is-read-header: true
