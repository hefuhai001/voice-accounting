<style>
        @keyframes flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #ffdbd0, #ff6b35, #ab3500, #ffb59d);
            background-size: 400% 400%;
            animation: flow 15s ease infinite;
        }
        .kinetic-ripple {
            animation: ripple 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .pulse-soft {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
        .glass-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-background bg-surface overflow-hidden h-screen flex flex-col">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile py-4 bg-surface/40 backdrop-blur-xl border-b border-white/50 shadow-sm">
<div class="flex items-center gap-3">
<button class="p-2 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary">Kinetic Vibrant</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary/20">
<img class="w-full h-full object-cover" data-alt="A stylish portrait of a young professional in a creative studio setting. The lighting is warm and natural, casting soft shadows. The overall aesthetic is clean, modern, and high-quality, mirroring a premium tech brand's visual identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKa9OAFSo65FEwFkvG4txjVQeEH5BSlWAmjDk8CKA0Ba3xftWJL5SmEKvaCXlWYN3CMendyXN01iyHcIsXWbkqtnpWyGBkeRnXnhcsZFF7ejEgoN53CKJEfQ0mOlCx7HKH8FmKvQNlKwdqgVRcnATSGhg1ak84RuOIpwPZAuEAINkChRFgWSxsPk7YKp1KldvyK8q-mX4-epVFYiLkEdQ4t13dYOKjWEuHbe9-_7GLehZarvzyWwazq2z0e9gKhKvxA6jde9rIbb6i"/>
</div>
</header>
<!-- Main Immersive Canvas -->
<main class="flex-grow relative flex flex-col items-center justify-center pt-24 pb-32 animated-bg">
<!-- Floating Voice Elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary/20 rounded-full blur-[100px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary-container/30 rounded-full blur-[120px]"></div>
</div>
<!-- Status Indicator -->
<div class="z-10 text-center mb-12">
<p class="font-label-sm text-label-sm text-on-primary-fixed tracking-widest uppercase mb-2">Voice Input</p>
<h2 class="font-headline-lg text-headline-lg text-on-primary-fixed pulse-soft">正在倾听...</h2>
</div>
<!-- Voice Hero Button -->
<div class="relative z-10">
<!-- Ripples -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="kinetic-ripple absolute w-32 h-32 border-2 border-white/40 rounded-full"></div>
<div class="kinetic-ripple absolute w-32 h-32 border-2 border-white/30 rounded-full" style="animation-delay: 1s"></div>
<div class="kinetic-ripple absolute w-32 h-32 border-2 border-white/20 rounded-full" style="animation-delay: 2s"></div>
</div>
<!-- Core Button -->
<button class="relative w-32 h-32 rounded-full bg-gradient-to-br from-primary-container to-primary shadow-[0px_20px_40px_rgba(255,107,53,0.3)] flex items-center justify-center transform active:scale-95 transition-all duration-300" id="voiceBtn">
<span class="material-symbols-outlined text-on-primary text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
<!-- Subtitle/Transcription area -->
<div class="z-10 mt-16 px-10 text-center max-w-lg">
<p class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary-fixed/80 leading-relaxed italic" id="transcription">
                “刚才在星巴克买了一杯拿铁，32块钱。”
            </p>
</div>
<!-- Real-time Recognition Cards (Bento Style) -->
<div class="absolute bottom-10 left-margin-mobile right-margin-mobile z-20 flex gap-4 overflow-x-auto no-scrollbar pb-4">
<!-- Amount Card -->
<div class="flex-shrink-0 min-w-[140px] bg-white/40 backdrop-blur-xl p-glass-padding rounded-xl border border-white/50 shadow-sm flex flex-col gap-2 transform translate-y-0 hover:-translate-y-2 transition-transform duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">payments</span> 金额
                </span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">¥ 32.00</span>
</div>
<!-- Category Card -->
<div class="flex-shrink-0 min-w-[140px] bg-white/40 backdrop-blur-xl p-glass-padding rounded-xl border border-white/50 shadow-sm flex flex-col gap-2 transform translate-y-0 hover:-translate-y-2 transition-transform duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">category</span> 分类
                </span>
<div class="flex items-center gap-2">
<span class="w-8 h-8 rounded-full bg-tertiary-container flex items-center justify-center">
<span class="material-symbols-outlined text-sm text-on-tertiary-container">coffee</span>
</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">餐饮</span>
</div>
</div>
<!-- Date Card -->
<div class="flex-shrink-0 min-w-[140px] bg-white/40 backdrop-blur-xl p-glass-padding rounded-xl border border-white/50 shadow-sm flex flex-col gap-2 transform translate-y-0 hover:-translate-y-2 transition-transform duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">calendar_today</span> 日期
                </span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">今天</span>
</div>
<!-- Store/Ledger Card -->
<div class="flex-shrink-0 min-w-[160px] bg-white/40 backdrop-blur-xl p-glass-padding rounded-xl border border-white/50 shadow-sm flex flex-col gap-2 transform translate-y-0 hover:-translate-y-2 transition-transform duration-300">
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">store</span> 账户
                </span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">招商银行</span>
</div>
</div>
</main>
<!-- Bottom Action Bar (Transactional Context) -->
<footer class="fixed bottom-0 left-0 w-full z-50 px-4 pb-8 flex items-center justify-center pointer-events-none">
<button class="pointer-events-auto flex items-center gap-2 bg-on-surface text-surface px-8 py-4 rounded-full font-headline-lg-mobile text-headline-lg-mobile shadow-2xl hover:scale-105 active:scale-95 transition-all">
<span>确认入账</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Bottom Nav Bar (Shared Component Logic - Filtered Out for Transactional) -->
<!-- The BottomNavBar is suppressed here because this is a focused transactional input screen -->
<script>
        // Micro-interactions for the voice UI
        const voiceBtn = document.getElementById('voiceBtn');
        const transcription = document.getElementById('transcription');
        const phrases = [
            "“刚才在星巴克买了一杯拿铁，32块钱。”",
            "“超市买菜花了58块五，用微信支付的。”",
            "“打车去公司，花费15元，今天加班报销。”",
            "“晚餐吃了火锅，和朋友AA，一共120元。”"
        ];
        let currentPhrase = 0;

        voiceBtn.addEventListener('click', () => {
            // Ripple effect trigger logic is handled by CSS, 
            // but we can simulate data update here.
            currentPhrase = (currentPhrase + 1) % phrases.length;
            transcription.style.opacity = '0';
            setTimeout(() => {
                transcription.innerText = phrases[currentPhrase];
                transcription.style.opacity = '1';
            }, 300);
        });

        // Simple transition for transcription
        transcription.style.transition = 'opacity 0.3s ease-in-out';
    </script>
</body></html>
