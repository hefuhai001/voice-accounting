<script>
        // Simple Interaction Logic for Tabs
        const tabs = document.querySelectorAll('.bg-surface-container-low button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('active-tab', 'text-primary');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('active-tab', 'text-primary');
                tab.classList.remove('text-on-surface-variant');
            });
        });

        // Hover Effect Animation logic
        const cards = document.querySelectorAll('.bg-white');
        cards.forEach(card => {
            card.addEventListener('mousedown', () => card.style.transform = 'scale(0.96)');
            card.addEventListener('mouseup', () => card.style.transform = 'scale(1)');
            card.addEventListener('mouseleave', () => card.style.transform = 'scale(1)');
        });
    </script>
