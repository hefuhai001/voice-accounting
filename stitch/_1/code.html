<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ab3500",
                        "primary-container": "#ff6b35",
                        "on-primary": "#ffffff",
                        "secondary": "#8d4f00",
                        "secondary-container": "#fe9824",
                        "surface": "#fcf8fb",
                        "surface-dim": "#dcd9dc",
                        "surface-gray": "#F2F2F7",
                        "surface-container-low": "#f6f3f5",
                        "surface-container": "#f0edef",
                        "on-surface": "#1b1b1d",

                        "outline": "#8d7168",

                        "glass-white": "rgba(255, 255, 255, 0.7)",

                        "stack-md": "12px",
                        "stack-sm": "4px",
                        "stack-lg": "24px",
                        "gutter-md": "16px",
                        "base": "8px"
                    },
                    fontFamily: {
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "display-lg": ["Hanken Grotesk"],
                        "label-sm": ["Inter"]
                    },
                    fontSize: {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],

<div class="w-12 h-12 rounded-xl bg-[#FFF5F2] flex items-center justify-center">
<span class="material-symbols-outlined text-primary">lunch_dining</span>

<button class="flex flex-col items-center justify-center text-primary pb-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm">首页</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant pb-2">

<button class="w-16 h-16 sunset-gradient rounded-full flex items-center justify-center shadow-lg shadow-primary/40 active:scale-95 transition-transform duration-150 ring-4 ring-white">
<span class="material-symbols-outlined text-white text-3xl">mic</span>
</button>
<span class="font-label-sm text-label-sm mt-1 text-primary-container font-bold">记一笔</span>
</div>
<button class="flex flex-col items-center justify-center text-on-surface-variant pb-2">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-label-sm text-label-sm">记录</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant pb-2">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-sm text-label-sm">分类</span>
</button>
</nav>
<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('opacity-70');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('opacity-70');
            });
        });
    </script>
</body></html>
