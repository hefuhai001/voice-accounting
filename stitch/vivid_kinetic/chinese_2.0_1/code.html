<style>
        /* Light Theme Mesh Background */
        .mesh-bg {
            background-color: #f8f9fc;
            background-image: 
                radial-gradient(at 0% 0%, hsla(280, 80%, 98%, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(170, 80%, 98%, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(20, 80%, 98%, 0.6) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(220, 80%, 98%, 0.6) 0px, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
        }

        /* Glassmorphism Classes for Bright Theme */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.02);
        }

        /* Glow effects */
        .glow-primary {
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.35);
        }
        
        .text-glow {
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.15);
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-background text-on-surface font-body-md mesh-bg min-h-screen pb-32">

<div class="flex justify-between items-center px-container-padding py-4 w-full">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden border border-black/5 ring-2 ring-primary/10">
<img class="w-full h-full object-cover" data-alt="A close up portrait photo of a stylish young adult." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC9xE5QxIMQ_3q_FaGf5FEY-BrUNYc-SVb_LRZl1JpYq8dpuTs56h_bP--HA93A9uOnUYWEbjRzmRHFoeMYqIxWCJgl3gSxM1AmQr_0AiL5eXza-o7_46z91Nym3p9RN4-98YAsCVwrQNqYI6HpZinyVYwtKzI4IJOCn0mbeV-SCjgNxDboXCDNp6s12s8Ehv0wynHggB9iibY4w1-VpzEmzf72mkoEKBoxFOL8gq0tqRe9InoWwcDAHwj0GX0VSaiAMZxKsS6FMYeG"/>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface tracking-tight">FinanceFlow</h1>
</div>
<button class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container/80 active:scale-95 transition-all bg-white/50 border border-black/5 backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-28 px-container-padding flex flex-col gap-section-gap max-w-md mx-auto">

<section class="flex flex-col gap-1">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">欢迎回来</span>
<h2 class="font-headline-lg text-headline-lg text-on-surface">你好, hfh</h2>
</section>

<section class="grid grid-cols-2 gap-4">

<div class="col-span-2 glass-card rounded-3xl p-6 flex flex-col gap-4 relative overflow-hidden group">

<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary/10 rounded-full blur-3xl group-hover:bg-primary/15 transition-colors duration-500"></div>
<div class="flex justify-between items-start z-10">

<div class="font-display-lg text-display-lg text-primary text-glow mt-2">
                        ¥8,432<span class="text-2xl text-primary/70">.50</span>
</div>
</div>
<div class="bg-secondary-container/10 text-secondary border border-secondary/30 px-3 py-1 rounded-full flex items-center gap-1 backdrop-blur-md">
<span class="material-symbols-outlined text-[14px] font-bold">trending_down</span>

</div>
</div>
</div>

</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface z-10 font-bold">
                ¥12.5k
            </div>
</div>

<div class="w-14 h-14 rounded-2xl bg-surface-container flex items-center justify-center border border-on-surface/5 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="flex flex-col">

</div>

<nav class="fixed bottom-8 left-0 right-0 z-50 flex justify-around items-center px-6 py-4 mx-auto max-w-md bg-white/80 backdrop-blur-2xl rounded-full border border-black/5 shadow-2xl shadow-black/10 w-[calc(100%-48px)]">
<!-- Tab 1: Home (Active) -->

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const voiceBtn = document.querySelector('[data-icon="mic"]').parentElement;
        voiceBtn.addEventListener('mouseenter', () => {
            voiceBtn.style.transform = 'translateY(-24px) scale(1.6)';
        });
        voiceBtn.addEventListener('mouseleave', () => {
            voiceBtn.style.transform = 'translateY(-24px) scale(1.5)';
        });
    });
</script>
