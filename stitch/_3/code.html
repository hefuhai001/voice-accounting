<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        }

            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(171, 53, 0, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(171, 53, 0, 0); }

        }

<body class="bg-surface font-body-md text-on-surface antialiased overflow-x-hidden min-h-screen">

<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex justify-between items-center px-margin-mobile h-16">

<div class="flex items-center gap-4">

</div>
<!-- Detail Rows -->
<div class="space-y-4">
<div class="flex justify-between items-center py-3 border-b border-surface-variant/50">
<span class="font-body-md text-on-surface-variant">分类</span>
<button class="flex items-center gap-2 font-body-md text-on-surface-variant/60">
                        选择分类
                        <span class="material-symbols-outlined text-base">expand_more</span>
</button>
</div>
<div class="flex justify-between items-center py-3 border-b border-surface-variant/50">
<span class="font-body-md text-on-surface-variant">账本</span>
<button class="flex items-center gap-2 font-body-md text-on-surface">
                        日常账本
                        <span class="material-symbols-outlined text-base">expand_more</span>
</button>

</button>

<input class="w-full font-body-md text-on-surface placeholder:text-on-surface-variant/40 bg-transparent border-none focus:ring-0 px-0" placeholder="添加备注..." type="text"/>

<script>
        // Simple Interaction logic
        const recordBtn = document.getElementById('record-btn');
        let isRecording = false;

        recordBtn.addEventListener('click', () => {
            isRecording = !isRecording;
            if(isRecording) {
                recordBtn.classList.add('recording-pulse');
                recordBtn.querySelector('span').textContent = '正在识别...';
                recordBtn.querySelector('div').classList.replace('bg-danger-red', 'bg-success-green');
            } else {
                recordBtn.classList.remove('recording-pulse');
                recordBtn.querySelector('span').textContent = '开始录音';
                recordBtn.querySelector('div').classList.replace('bg-success-green', 'bg-danger-red');
            }
        });

        // Tab Switching
        const tabExp = document.getElementById('tab-expenditure');
        const tabInc = document.getElementById('tab-income');

        function setActive(active, inactive) {
            active.classList.add('bg-white', 'shadow-sm', 'text-on-surface');
            active.classList.remove('text-on-surface-variant', 'hover:bg-surface-variant/50');
            inactive.classList.remove('bg-white', 'shadow-sm', 'text-on-surface');
            inactive.classList.add('text-on-surface-variant', 'hover:bg-surface-variant/50');
        }

        tabExp.addEventListener('click', () => setActive(tabExp, tabInc));
        tabInc.addEventListener('click', () => setActive(tabInc, tabExp));
    </script>
</body></html>
